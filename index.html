    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="6개의 작은 선택으로 알아보는 우리 둘의 취향. 약 1분, 가입 없이 친구와 비교해요.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="취향 싱크 · 우리, 얼마나 통할까?">
    <meta property="og:description" content="6개만 골라봐. 우리 어디서 통하는지 알려줄게. 약 1분 · 가입 없음">
    <meta property="og:image" content="https://planndoit.github.io/viral/share.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary_large_image">
    <title>취향 싱크 · 우리, 얼마나 통할까?</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="취향 싱크 처음으로"><span class="brand-icon" aria-hidden="true">↗↙</span> 취향 싱크<span class="brand-dot">.</span></a>
      <span class="header-note">친구 사이, 작은 발견</span>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer"><span>가볍게 고르고, 즐겁게 나누기.</span><button class="text-button" id="privacy-button" type="button">답변과 링크 안내</button></footer>
    <dialog id="privacy-dialog" aria-labelledby="privacy-title">
      <h2 id="privacy-title">가벼운 놀이, 알아두면 좋은 점</h2>
      <p>6개의 선택을 비교하는 놀이예요. 성격이나 관계를 진단하지 않아요.</p>
      <p>답변은 공유 링크에 담겨요. 링크를 가진 사람은 답변을 볼 수 있으니, 공개하고 싶은 친구에게만 보내주세요. 이름이나 연락처는 입력하지 않아요.</p>
      <p>이 서비스는 답변을 별도 서버에 저장하지 않고 분석·광고 도구를 사용하지 않아요. 최근 내 답변은 이 브라우저에만 저장해요. 웹 호스팅 서비스에는 일반적인 접속 기록이 남을 수 있어요.</p>
      <button class="secondary full" id="clear-saved" type="button">이 브라우저의 내 답변 지우기</button>
      <p id="privacy-status" class="small" role="status"></p>
      <button class="primary full" id="close-privacy" type="button">확인했어요</button>
    </dialog>
    <noscript><p class="noscript">취향 싱크를 사용하려면 브라우저에서 JavaScript를 켜주세요.</p></noscript>
  </body>
</html>
